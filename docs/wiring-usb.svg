<svg xmlns="http://www.w3.org/2000/svg" width="800" height="220" viewBox="0 0 800 220" role="img" aria-labelledby="title desc"><title id="title">ESP32 USB connection</title><desc id="desc">Computer USB connects to the USB connector directly on the ESP32 DevKit board. No external GPIO wiring is required.</desc><rect width="800" height="220" fill="#fafaf6"/><g fill="none" stroke="#34492b" stroke-width="3"><rect x="25" y="45" width="200" height="100" rx="12"/><rect x="540" y="45" width="235" height="100" rx="12"/><path d="M225 95H540"/></g><g fill="#253124" font-family="Arial,sans-serif" font-size="19"><text x="65" y="103">Computer</text><text x="570" y="103">ESP32 DevKit V1</text><text x="285" y="77">USB data + power</text><text x="25" y="185" font-size="16">Use the USB connector on the DevKit itself, not the expansion board power connector.</text></g></svg>
