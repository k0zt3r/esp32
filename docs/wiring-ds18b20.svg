<svg xmlns="http://www.w3.org/2000/svg" width="840" height="360" viewBox="0 0 840 360" role="img" aria-labelledby="title desc">
<title id="title">ESP32 and DS18B20, powered three-wire connection</title><desc id="desc">3V3 to VDD, GPIO4 to DQ, GND to GND. A 4.7 kiloohm resistor connects DQ to 3V3.</desc>
<rect width="840" height="360" fill="#fafaf6"/><g fill="none" stroke="#34492b" stroke-width="3"><rect x="30" y="50" width="190" height="260" rx="14"/><rect x="580" y="50" width="220" height="260" rx="14"/><path d="M220 100H580M220 200H580M220 280H580M400 100V125M400 165V200"/><rect x="391" y="125" width="18" height="40"/><circle cx="400" cy="100" r="4" fill="#34492b"/><circle cx="400" cy="200" r="4" fill="#34492b"/></g>
<g fill="#253124" font-family="Arial,sans-serif" font-size="18"><text x="50" y="37" font-weight="bold">ESP32 DevKit V1</text><text x="615" y="37" font-weight="bold">DS18B20</text><text x="155" y="106">3V3</text><text x="95" y="206">D4 / GPIO4</text><text x="152" y="286">GND</text><text x="600" y="106">VDD</text><text x="600" y="206">DQ</text><text x="600" y="286">GND</text><text x="425" y="152">4.7 kΩ</text><text x="30" y="343" font-size="15">Connect by signal name. Sensor pin order depends on the package/module.</text></g></svg>
