<svg xmlns="http://www.w3.org/2000/svg" width="820" height="360" viewBox="0 0 820 360" role="img" aria-labelledby="title desc"><title id="title">OLED I2C wiring to ESP32</title><desc id="desc">OLED GND to common ground C10, VCC to 3V3 C12, SCL to GPIO22, SDA to GPIO21. Each OLED pin must occupy a different numbered breadboard row.</desc><rect width="820" height="360" fill="#fafaf6"/><g fill="none" stroke="#34492b" stroke-width="3"><rect x="25" y="40" width="235" height="260" rx="12"/><rect x="560" y="40" width="230" height="260" rx="12"/><path d="M260 90H560M260 150H560M260 210H560M260 270H560"/></g><g fill="#253124" font-family="Arial,sans-serif" font-size="18"><text x="45" y="28">ESP32 / breadboard</text><text x="590" y="28">OLED I2C</text><text x="45" y="96">GND · C10</text><text x="45" y="156">3V3 · C12</text><text x="45" y="216">D22 / GPIO22</text><text x="45" y="276">D21 / GPIO21</text><text x="580" y="96">GND</text><text x="580" y="156">VCC</text><text x="580" y="216">SCL</text><text x="580" y="276">SDA</text><text x="25" y="335" font-size="15">Wire by labels. Diagram pin positions do not represent the physical pin order.</text></g></svg>
